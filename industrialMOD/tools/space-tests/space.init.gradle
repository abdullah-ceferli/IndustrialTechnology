allprojects { afterEvaluate { p -> if (p.plugins.hasPlugin('forge')) {
    p.sourceSets { spaceChecks { java.srcDir 'tools/space-tests/src'; compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath; runtimeClasspath += p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath } }
    def checkJar=p.tasks.create('spaceChecksJar',Jar){outputs.upToDateWhen { !p.hasProperty('spaceModelOnly') };  dependsOn p.tasks.spaceChecksClasses; archiveBaseName.set('industrialtech-space-checks'); archiveVersion.set('1'); destinationDirectory.set(p.file('.toolchain/space-checks')); from p.sourceSets.spaceChecks.output }
    if(p.hasProperty('spaceProduction')){p.tasks.jar.outputs.upToDateWhen { false };p.tasks.reobf.outputs.upToDateWhen { false };p.tasks.reobf.reobf(checkJar){spec -> spec.classpath=p.sourceSets.spaceChecks.compileClasspath}}
    if(p.hasProperty('spaceClient')) {p.tasks.runClient.dependsOn checkJar; p.tasks.runClient.jvmArgs '-Dindustrialtech.spaceClient=true';if(p.hasProperty('shuttleGallery'))p.tasks.runClient.jvmArgs '-Dindustrialtech.shuttleGallery=true';if(p.hasProperty('shuttleClient'))p.tasks.runClient.jvmArgs '-Dindustrialtech.shuttleClient=true';if(p.hasProperty('spaceSky'))p.tasks.runClient.jvmArgs '-Dindustrialtech.spaceSky=true';if(p.hasProperty('spaceVisual'))p.tasks.runClient.jvmArgs '-Dindustrialtech.spaceVisual=true';if(p.hasProperty('spaceModelOnly'))p.tasks.runClient.jvmArgs '-Dindustrialtech.spaceModelOnly=true';p.tasks.runClient.args '--width','960','--height','720';def copySpace=p.tasks.create('copySpaceChecks',Copy){dependsOn checkJar;from checkJar.archiveFile;into p.file("${p.minecraft.runDir}/mods")};p.tasks.runClient.dependsOn copySpace}
} } }
