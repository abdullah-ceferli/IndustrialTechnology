# Configuration file

client {
    # Render selected chunk outlines after clicking Preview. [default: true]
    B:enableAreaPreview=true
}


energy {
    # Average incoming RF/t required for full speed. [range: 1 ~ 1000000, default: 20000]
    I:maximumSpeedRFPerTick=20000

    # Aggregate input limit across all six sides. [range: 1 ~ 1000000, default: 20000]
    I:rfInputPerTick=20000
}


general {
    # Force exactly the selected chunks while running. [default: true]
    B:automaticQuarryChunkLoading=true
    I:balanceVersion=2

    # Log mining and ticket diagnostics. [default: false]
    B:debugLogging=false

    # Enable tier Fortune levels. [default: true]
    B:enableFortune=true

    # Enable supported Silk Touch harvesting. [default: true]
    B:enableSilkTouch=true

    # Hard upper bound: 25. Center is always selected. [range: 1 ~ 25, default: 25]
    I:maximumSelectableChunks=25
}


performance {
    # Shared removal budget; round-robin scheduling. [range: 1 ~ 128, default: 40]
    I:globalRemovalsPerTick=40

    # Shared scan budget across all dimensions. [range: 1 ~ 8192, default: 4096]
    I:globalScansPerTick=4096

    # Hard maximum real blocks removed per machine per tick. [range: 1 ~ 16, default: 5]
    I:removalsPerMachinePerTick=5

    # Maximum cursor positions checked per machine per tick. [range: 1 ~ 512, default: 256]
    I:scansPerMachinePerTick=256
}


quarrymk1 {
    # Target maximum at maximumSpeedRFPerTick. Actual rate also requires RF per block. [range: 1 ~ 16, default: 5]
    I:maximumBlocksPerTick=5

    # Multiplies target work rate; cannot bypass energy or operation budgets. [range: 0.1 ~ 4.0, default: 1.0]
    S:miningSpeedMultiplier=1.0

    # Stored RF. [range: 1000 ~ 100000000, default: 400000]
    I:rfCapacity=400000

    # Charged only for successful harvesting. [range: 1 ~ 400000, default: 4000]
    I:rfPerBlock=4000
}


quarrymk2 {
    # Target maximum at maximumSpeedRFPerTick. Actual rate also requires RF per block. [range: 1 ~ 16, default: 5]
    I:maximumBlocksPerTick=5

    # Multiplies target work rate; cannot bypass energy or operation budgets. [range: 0.1 ~ 4.0, default: 1.0]
    S:miningSpeedMultiplier=1.0

    # Stored RF. [range: 1000 ~ 100000000, default: 1600000]
    I:rfCapacity=1600000

    # Charged only for successful harvesting. [range: 1 ~ 1600000, default: 4000]
    I:rfPerBlock=4000
}


quarrymk3 {
    # Target maximum at maximumSpeedRFPerTick. Actual rate also requires RF per block. [range: 1 ~ 16, default: 5]
    I:maximumBlocksPerTick=5

    # Multiplies target work rate; cannot bypass energy or operation budgets. [range: 0.1 ~ 4.0, default: 1.0]
    S:miningSpeedMultiplier=1.0

    # Stored RF. [range: 1000 ~ 100000000, default: 6400000]
    I:rfCapacity=6400000

    # Charged only for successful harvesting. [range: 1 ~ 6400000, default: 4000]
    I:rfPerBlock=4000
}


wireless {
    # Minimum ticks between inventory scans per automation endpoint. [range: 5 ~ 200, default: 10]
    I:automationPollTicks=10

    # Round-robin endpoint visit budget; large registries may poll more slowly. [range: 1 ~ 256, default: 64]
    I:automationVisitsPerTick=64

    # Maximum linked devices per terminal. [range: 1 ~ 128, default: 128]
    I:endpointsPerTerminal=128

    # World-wide device registry bound. [range: 128 ~ 32768, default: 8192]
    I:globalEndpoints=8192

    # Maximum saved script characters; eight rules maximum. [range: 256 ~ 8192, default: 4096]
    I:maximumScriptCharacters=4096

    # Minimum ticks between ZIRNOX feeder polls. [range: 10 ~ 200, default: 20]
    I:reactorPollTicks=20

    # Maximum real fuel transfers per feeder poll. [range: 1 ~ 8, default: 2]
    I:reactorTransfersPerPoll=2

    # Shared work bound for active reactor feeders. [range: 1 ~ 64, default: 8]
    I:reactorTransfersPerTick=8

    # Maximum independent terminal networks per owner. [range: 1 ~ 32, default: 8]
    I:terminalsPerOwner=8
}


