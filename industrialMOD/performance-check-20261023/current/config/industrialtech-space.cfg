# Configuration file

atmosphere {
    # Breathable air mB required per cubic metre at nominal pressure. [range: 1 ~ 1000, default: 50]
    I:airPerBlock=50

    # Maximum flood-fill radius. [range: 4 ~ 64, default: 32]
    I:maxRoomRadius=32

    # Larger spaces report unsealed/too large. [range: 16 ~ 32768, default: 4096]
    I:maxRoomVolume=4096

    # Periodic validation catches changes from mods that omit block events. [range: 20 ~ 600, default: 100]
    I:roomRescanTicks=100
}


dimensions {
    # Must be unused by other mods. [range: 0 ~ 255, default: 181]
    I:marsBiome=181

    # Reserved Mars dimension ID. [range: 2 ~ 65535, default: 181]
    I:marsDimension=181

    # Must be unused by other mods. [range: 0 ~ 255, default: 180]
    I:moonBiome=180

    # Reserved ID. Resolve conflicts before enabling travel; existing saves require stable IDs. [range: 2 ~ 65535, default: 180]
    I:moonDimension=180
}


environment {
    # Bounded deterministic regional Mars dust haze. [default: true]
    B:dustStorms=true

    # Martian daylight cycle. [range: 12000 ~ 240000, default: 24600]
    I:marsDayTicks=24600

    # Compressed lunar daylight cycle. [range: 24000 ~ 2400000, default: 480000]
    I:moonDayTicks=480000

    # Read preprocessed <=512px grayscale PNG references from config/industrialtech-space/. New chunks only; maintain identical files for the save. [default: false]
    B:optionalHeightReferences=false
}


machines {
    # Manufacturing and research RF/t. [range: 1 ~ 100000, default: 200]
    I:processRFPerTick=200

    # mB per tank. [range: 10000 ~ 1000000, default: 100000]
    I:tankCapacity=100000
}


missions {
    # Animated ascent. [range: 100 ~ 2400, default: 240]
    I:ascentTicks=240

    # Countdown before ignition. [range: 60 ~ 1200, default: 100]
    I:countdownTicks=100

    # Animated descent. [range: 100 ~ 2400, default: 200]
    I:descentTicks=200

    # LOX mB per kerosene mB. [range: 1 ~ 4, default: 2]
    I:loxRatio=2

    # One Mars leg; Moon research required first. [range: 1000 ~ 100000, default: 24000]
    I:marsKerosene=24000

    # One leg; reserve an additional leg for return. [range: 1000 ~ 100000, default: 12000]
    I:moonKerosene=12000
}


performance {
    # Shared budget across all loaded rooms. [range: 64 ~ 16384, default: 1024]
    I:globalRoomNodesPerTick=1024

    # Grace after the last player leaves, plus bounded travel exemptions. [range: 0 ~ 1200, default: 100]
    I:idleGraceTicks=100

    # Bounded candidates in a 32 block region. [range: 9 ~ 81, default: 49]
    I:landingCandidates=49

    # Client effect limit. [range: 0 ~ 64, default: 12]
    I:particlesPerTick=12

    # Suspend only Industrial Technology tickets and quarry work in empty dimensions. [default: true]
    B:pauseOwnedChunkLoadingInUnoccupiedDimensions=true

    # Apply idle suspension on owned planets too. [default: true]
    B:pausePlanetMachines=true

    # Per room flood fill budget. [range: 16 ~ 2048, default: 256]
    I:roomNodesPerTick=256
}


research {
    # Powered server ticks stored on the HDD. [range: 20 ~ 720000, default: 6000]
    I:marsTicks=6000

    # Powered server ticks stored on the HDD. [range: 20 ~ 720000, default: 200]
    I:moonTicks=200
}


resources {
    # Bounded gameplay vein density, not a measured real-world ore grade. [range: 1 ~ 4, default: 1]
    I:depositDensity=1

    # Generate scientifically inspired mineral-bearing rocks in new owned planet chunks only. Existing chunks are never changed. [default: true]
    B:mineralDeposits=true
}


suits {
    # Chest pack capacity; 1 mB supplies 20 ticks. [range: 1 ~ 1440, default: 10]
    I:tier1Minutes=10

    # Chest pack capacity; 1 mB supplies 20 ticks. [range: 1 ~ 1440, default: 30]
    I:tier2Minutes=30

    # Chest pack capacity; 1 mB supplies 20 ticks. [range: 1 ~ 1440, default: 90]
    I:tier3Minutes=90
}


