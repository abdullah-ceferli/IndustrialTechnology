buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
    }
    dependencies { classpath 'com.anatawa12.forge:ForgeGradle:1.2-1.1.1' }
}
apply plugin: 'forge'
apply plugin: 'java'
version = '2.10.1'
group = 'dev.industrialtechnology'
archivesBaseName = 'IndustrialTechnology-1.7.10'
sourceCompatibility = targetCompatibility = '1.8'
minecraft {
    version = '1.7.10-10.13.4.1614-1.7.10'
    runDir = project.findProperty('testRunDir') ?: 'run'
}
repositories { mavenCentral() }
dependencies { runtimeOnly files('.toolchain/opencomputers-upstream/OpenComputers-combined-development.jar') }
dependencies { testImplementation 'junit:junit:4.13.2'; compileOnly files('.toolchain/accessories-upstream/Baubles-dev.jar', '.toolchain/hbm-api/HBM-X5771-dev.jar', '.toolchain/nei/NotEnoughItems-1.7.10-1.0.5.120-dev.jar', '.toolchain/nei/CodeChickenLib-1.7.10-1.1.3.140-dev.jar', 'vendor/opencomputers/OpenComputers-MC1.7.10-1.8.10+667626d-dev.jar') }
tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') { expand 'version': project.version }
}
jar {
    manifest { attributes 'Implementation-Title': 'Industrial Technology', 'Implementation-Version': project.version, 'FMLCorePlugin': 'dev.industrialtechnology.energy.core.CombinedCorePlugin', 'FMLAT': 'oc_at.cfg', 'FMLCorePluginContainsFMLMod': 'true' }
    from('development-assets/accessories/original-assets.json') { into 'META-INF/accessories' }
    from(['LICENSE', 'THIRD_PARTY.md', 'ASSET_CREDITS.md']) { into 'META-INF' }
}
task sourcesJar(type: Jar, dependsOn: classes) {
    archiveClassifier.set('sources')
    from sourceSets.main.allSource
    from('development-assets/accessories/original-assets.json') { into 'development-assets/accessories' }
    from 'ACCESSORIES_GUIDE.md'
    from('docs/CHANGES-2.10.0.md') { into 'docs' }
    from('docs/CHANGES-2.10.1.md') { into 'docs' }
    from 'OPENCOMPUTERS_GUIDE.md'
    from('docs/CHANGES-2.9.0.md') { into 'docs' }
    from(zipTree('vendor/opencomputers/OpenComputers-MC1.7.10-1.8.10+667626d-sources.jar')) { into 'opencomputers/src' }
    from(zipTree('vendor/opencomputers/OpenComputers-MC1.7.10-1.8.10+667626d-universal.jar')) { include 'assets/**', 'application.conf', 'pack.mcmeta'; into 'opencomputers/resources' }
    from('vendor/opencomputers/notices') { into 'opencomputers/notices' }
    from('vendor/opencomputers/upstream.json') { into 'opencomputers' }
    from 'BATTERY_MONITOR_GUIDE.md'
    from('docs/CHANGES-2.8.0.md') { into 'docs' }
    from 'LEGACY_HBM_STORAGE.md'
    from('docs/CHANGES-2.7.1.md') { into 'docs' }
    from('docs/CHANGES-2.7.2.md') { into 'docs' }
    from 'BAG_GUIDE.md'
    from('docs/CHANGES-2.7.0.md') { into 'docs' }
    from 'CONSOLE_GUIDE.md'
    from('docs/CHANGES-2.6.0.md') { into 'docs' }
    from('docs/CHANGES-2.6.1.md') { into 'docs' }
    from 'STEEL_FACTORY_GUIDE.md'
    from('docs/CHANGES-2.5.0.md') { into 'docs' }
    from('docs/CHANGES-2.5.1.md') { into 'docs' }
    from 'LICENSE', 'THIRD_PARTY.md', 'README.md', 'AUTOMATION_CODES.md', 'PROJECT_HANDOFF.md', 'SOLAR_AND_RAILWAY_GUIDE.md', 'ASSET_CREDITS.md'
    from('docs/CHANGES-2.2.0.md') { into 'docs' }
    from('docs/CHANGES-2.2.1.md') { into 'docs' }
    from('docs/CHANGES-2.3.0.md') { into 'docs' }
    from('docs/CHANGES-2.3.1.md') { into 'docs' }
    from('docs/CHANGES-2.4.0.md') { into 'docs' }
    from('docs/CHANGES-2.4.1.md') { into 'docs' }
    from('docs/CHANGES-2.4.2.md') { into 'docs' }
    from('docs/CAPACITOR_BANK.md') { into 'docs' }
}
artifacts { archives sourcesJar }

// A separate test-only Forge mod runs in a disposable dedicated server. Never shipped in the release JAR.
sourceSets {
    testMod {
        java.srcDir 'src/testMod/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
task testModJar(type: Jar, dependsOn: testModClasses) {
    archiveBaseName.set('industrialtech-test-harness')
    destinationDirectory.set(file("${minecraft.runDir}/mods"))
    from sourceSets.testMod.output
}
if (project.hasProperty('testServer')) {
    runServer.dependsOn testModJar
    runServer.standardInput = System.in
}
if (project.hasProperty('batteryClient')) { runClient.jvmArgs '-Dindustrialtech.batteryClient=true' }
runClient.jvmArgs '-Dfml.coreMods.load=dev.industrialtechnology.energy.core.CombinedCorePlugin'
if (project.hasProperty('legacyStorageClient')) { runClient.jvmArgs '-Dindustrialtech.legacyStorageClient=true' }
if (project.hasProperty('bagClient')) { runClient.jvmArgs '-Dindustrialtech.bagClient=true' }
if (project.hasProperty('consoleFacingClient')) { runClient.jvmArgs '-Dindustrialtech.consoleFacingClient=true' }
if (project.hasProperty('consoleClient')) { runClient.jvmArgs '-Dindustrialtech.consoleClient=true' }
if (project.hasProperty('steelClient')) { runClient.jvmArgs '-Dindustrialtech.steelClient=true' }
if (project.hasProperty('bankClient')) { runClient.jvmArgs '-Dindustrialtech.bankClient=true' }
if (project.hasProperty('lampClient')) { runClient.jvmArgs '-Dindustrialtech.lampTest=true'; jar.outputs.upToDateWhen { false }; testModJar.outputs.upToDateWhen { false } }
if (project.hasProperty('reactorClient')) { runClient.jvmArgs '-Dindustrialtech.reactorTest=true' }
if (project.hasProperty('neiTest')) { runClient.jvmArgs '-Dindustrialtech.neiTest=true' }
if (project.hasProperty('codeClient')) { runClient.jvmArgs '-Dindustrialtech.codeTest=true' }
if (project.hasProperty('wirelessClient')) { runClient.jvmArgs '-Dindustrialtech.wirelessTest=true' }
if (project.hasProperty('testClient')) {
    runClient.dependsOn testModJar
    runClient.args '--width', '960', '--height', '720'
}
runServer.args 'nogui'
if (project.hasProperty('productionTest')) {
    jar.outputs.upToDateWhen { false }
    testModJar.outputs.upToDateWhen { false }
    reobf.outputs.upToDateWhen { false }
    tasks.reobf.reobf(tasks.testModJar) { spec -> spec.classpath = sourceSets.testMod.compileClasspath }
}
task verifyAutomationReference {
    doLast {
        def source = file('src/main/resources/assets/industrialtech/automation_reference.json')
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString()
        if (!file('AUTOMATION_CODES.md').text.contains('Reference SHA256: ' + digest)) throw new GradleException('Run tools/create_automation_docs.py after updating the command reference.')
    }
}
check.dependsOn verifyAutomationReference
task writeRuntimeClasspath {
    doLast {
        file('.toolchain').mkdirs()
        file('.toolchain/runtime-classpath.txt').text = sourceSets.main.runtimeClasspath.files
            .findAll { it.absolutePath.contains('modules-2') }.collect { it.absolutePath }.join(File.pathSeparator)
    }
}

if (project.hasProperty('railClient')) { runClient.jvmArgs '-Dindustrialtech.railClient=true' }


// Upstream OC is already compiled/obfuscated. Merge only after our reobf task.
jar.outputs.upToDateWhen { false }
reobf.outputs.upToDateWhen { false }
task bundleOpenComputers(type: Exec, dependsOn: reobf) {
    commandLine(project.findProperty('bundlePython') ?: 'python', file('tools/bundle_opencomputers.py').absolutePath,
        '--base', jar.archivePath.absolutePath)
}
assemble.dependsOn bundleOpenComputers
if (project.hasProperty('ocClient')) { runClient.jvmArgs '-Dindustrialtech.ocClient=true' }

task prepareOpenComputersDevelopment(type: Exec) {
    commandLine(project.findProperty('bundlePython') ?: 'python', file('tools/prepare_oc_development.py').absolutePath)
}
runClient.dependsOn prepareOpenComputersDevelopment
runServer.dependsOn prepareOpenComputersDevelopment

dependencies { runtimeOnly files('.toolchain/accessories-upstream/Baubles-dev.jar') }
task prepareAccessoryDevelopment(type: Exec, dependsOn: genSrgs) {
    commandLine(project.findProperty('bundlePython') ?: 'python', file('tools/prepare_accessory_development.py').absolutePath)
}
compileJava.dependsOn prepareAccessoryDevelopment
if(project.hasProperty('accessoryClient')) { runClient.jvmArgs '-Dindustrialtech.accessoryClient=true' }
